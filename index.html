<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Gradient Maker</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: #111; color: white; display: flex; justify-content: center; padding: 30px 15px; } .container { width: 100%; max-width: 900px; } h1 { text-align: center; margin: 0 0 8px; font-size: 32px; } .subtitle { text-align: center; color: #999; margin-bottom: 25px; } .preview { width: 100%; height: 220px; border-radius: 16px; background: linear-gradient(to right, white, black); border: 1px solid #333; margin-bottom: 20px; box-shadow: 0 10px 35px rgba(0,0,0,.35); } .controls { background: #1b1b1b; border: 1px solid #333; border-radius: 16px; padding: 20px; } .stops { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; } .stop { display: flex; align-items: center; gap: 12px; background: #252525; padding: 12px; border-radius: 10px; } .color-picker { width: 55px; height: 42px; padding: 0; border: none; background: none; cursor: pointer; } .rgb-input { flex: 1; min-width: 0; background: #111; border: 1px solid #444; color: white; border-radius: 7px; padding: 10px; font-size: 15px; font-family: monospace; } .position { width: 80px; background: #111; border: 1px solid #444; color: white; border-radius: 7px; padding: 10px; } button { border: none; border-radius: 8px; padding: 11px 16px; background: #333; color: white; cursor: pointer; font-size: 14px; transition: .15s; } button:hover { background: #444; } .primary { background: #fff; color: #111; font-weight: bold; } .primary:hover { background: #ddd; } .danger { background: #5a2222; } .danger:hover { background: #753030; } .button-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; } .output-label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; } .output { display: flex; gap: 10px; } #output { flex: 1; min-width: 0; background: #0b0b0b; border: 1px solid #444; border-radius: 8px; color: #fff; padding: 13px; font-family: monospace; font-size: 15px; } .message { height: 20px; margin-top: 8px; color: #7cff9a; font-size: 13px; } @media (max-width: 600px) { .stop { flex-wrap: wrap; } .rgb-input { flex-basis: 100%; } .position { flex: 1; } .output { flex-direction: column; } .preview { height: 160px; } } </style> </head> <body> <div class="container"> <h1>Gradient Maker</h1> <div class="subtitle"> Create, reverse and copy RGB gradients </div> <div class="preview" id="preview"></div> <div class="controls"> <div class="stops" id="stops"></div> <div class="button-row"> <button onclick="addStop()">+ Add Color</button> <button onclick="reverseGradient()">↔ Reverse</button> <button onclick="resetGradient()">Reset</button> </div> <label class="output-label"> Gradient RGB codes </label> <div class="output"> <input id="output" type="text" value="255,255,255 0,0,0" spellcheck="false" > <button class="primary" onclick="copyGradient()"> Copy </button> </div> <div class="message" id="message"></div> </div> </div> <script> let stops = [ { color: "#ffffff", position: 0 }, { color: "#000000", position: 100 } ]; const stopsContainer = document.getElementById("stops"); const preview = document.getElementById("preview"); const output = document.getElementById("output"); const message = document.getElementById("message"); function hexToRgb(hex) { hex = hex.replace("#", ""); if (hex.length === 3) { hex = hex.split("").map(x => x + x).join(""); } const number = parseInt(hex, 16); return { r: (number >> 16) & 255, g: (number >> 8) & 255, b: number & 255 }; } function rgbToHex(r, g, b) { return "#" + [r, g, b] .map(x => Number(x).toString(16).padStart(2, "0")) .join(""); } function renderStops() { stopsContainer.innerHTML = ""; stops.forEach((stop, index) => { const rgb = hexToRgb(stop.color); const div = document.createElement("div"); div.className = "stop"; div.innerHTML = ` <input class="color-picker" type="color" value="${stop.color}" title="Choose color" > <input class="rgb-input" type="text" value="${rgb.r},${rgb.g},${rgb.b}" spellcheck="false" placeholder="255,255,255" > <input class="position" type="number" min="0" max="100" value="${stop.position}" title="Position" > ${ stops.length > 2 ? `<button class="danger" onclick="removeStop(${index})">Remove</button>` : "" } `; const colorPicker = div.querySelector(".color-picker"); const rgbInput = div.querySelector(".rgb-input"); const positionInput = div.querySelector(".position"); colorPicker.addEventListener("input", () => { stops[index].color = colorPicker.value; renderStops(); }); rgbInput.addEventListener("change", () => { const rgb = parseRgb(rgbInput.value); if (rgb) { stops[index].color = rgbToHex(rgb.r, rgb.g, rgb.b); update(); } else { renderStops(); } }); positionInput.addEventListener("input", () => { let position = Number(positionInput.value); position = Math.max(0, Math.min(100, position)); stops[index].position = position; update(); }); stopsContainer.appendChild(div); }); update(); } function parseRgb(value) { const parts = value .trim() .split(",") .map(x => x.trim()); if (parts.length !== 3) { return null; } const rgb = parts.map(Number); if (rgb.some(x => !Number.isInteger(x) || x < 0 || x > 255)) { return null; } return { r: rgb[0], g: rgb[1], b: rgb[2] }; } function update() { const sorted = [...stops].sort( (a, b) => a.position - b.position ); const gradient = sorted .map(stop => `${stop.color} ${stop.position}%`) .join(", "); preview.style.background = `linear-gradient(to right, ${gradient})`; const rgbText = sorted .map(stop => { const rgb = hexToRgb(stop.color); return `${rgb.r},${rgb.g},${rgb.b}`; }) .join(" "); output.value = rgbText; } function addStop() { if (stops.length >= 20) { return; } const sorted = [...stops].sort( (a, b) => a.position - b.position ); let newPosition = 50; if (sorted.length >= 2) { const first = sorted[0].position; const last = sorted[sorted.length - 1].position; newPosition = Math.round((first + last) / 2); // Find a gap between existing stops for (let i = 0; i < sorted.length - 1; i++) { const gap = sorted[i + 1].position - sorted[i].position; if (gap > 1) { newPosition = Math.round( (sorted[i].position + sorted[i + 1].position) / 2 ); break; } } } stops.push({ color: "#888888", position: newPosition }); renderStops(); } function removeStop(index) { stops.splice(index, 1); renderStops(); } function reverseGradient() { stops = stops.map(stop => ({ color: stop.color, position: 100 - stop.position })); renderStops(); } function resetGradient() { stops = [ { color: "#ffffff", position: 0 }, { color: "#000000", position: 100 } ]; renderStops(); } async function copyGradient() { // Make sure the output always has exactly: // r,g,b r,g,b // with no spaces inside RGB codes. update(); try { await navigator.clipboard.writeText(output.value); message.textContent = "Copied!"; setTimeout(() => { message.textContent = ""; }, 1500); } catch (error) { output.select(); document.execCommand("copy"); message.textContent = "Copied!"; setTimeout(() => { message.textContent = ""; }, 1500); } } output.addEventListener("change", () => { const colors = output.value.trim().split(/\s+/); const parsed = colors .map(parseRgb) .filter(rgb => rgb !== null); if (parsed.length < 2) { message.textContent = "Use format: 255,255,255 0,0,0"; update(); return; } stops = parsed.map((rgb, index) => ({ color: rgbToHex(rgb.r, rgb.g, rgb.b), position: index / (parsed.length - 1) * 100 })); renderStops(); }); renderStops(); </script> </body> </html>
